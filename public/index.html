<!doctype html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mail-relay // live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0d10;
    --panel: #10151a;
    --panel-2: #141a20;
    --line: #1d252c;
    --text: #d9e2ea;
    --dim: #5c6b78;
    --dimmer: #37424c;
    --amber: #f0a83c;
    --green: #3fbf7f;
    --red: #ef5b5b;
    --blue: #6fb1e6;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  body{
    background-image:
      radial-gradient(circle at 15% -10%, rgba(240,168,60,0.05), transparent 40%),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: auto, 100% 28px, 28px 100%;
    background-position: 0 0;
  }
  .wrap{
    max-width: 980px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  header{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .glyph{
    color: var(--amber);
    font-weight:700;
  }
  h1{
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin:0;
    font-weight: 600;
    color: var(--text);
  }
  .sub{
    color: var(--dim);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .status{
    display:flex;
    align-items:center;
    gap: 22px;
    font-size: 12px;
    color: var(--dim);
  }
  .status .metric{ text-align:right; }
  .status .metric b{
    display:block;
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
  }
  .pulse-row{
    display:flex; align-items:center; gap:8px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--dimmer);
    box-shadow: 0 0 0 0 rgba(63,191,127,0.5);
  }
  .dot.live{
    background: var(--green);
    animation: pulse 2.2s infinite;
  }
  .dot.down{ background: var(--red); }
  .dot.flash{ animation: flash 0.9s ease-out; }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(63,191,127,0.45); }
    70%{ box-shadow: 0 0 0 7px rgba(63,191,127,0); }
    100%{ box-shadow: 0 0 0 0 rgba(63,191,127,0); }
  }
  @keyframes flash{
    0%{ background: var(--amber); box-shadow: 0 0 0 0 rgba(240,168,60,0.6); }
    100%{ background: var(--green); box-shadow: 0 0 0 10px rgba(240,168,60,0); }
  }
  .live-label{
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--dim);
  }
  .live-label.on{ color: var(--green); }
  .live-label.off{ color: var(--red); }

  .empty{
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 48px 20px;
    text-align:center;
    color: var(--dim);
    font-size: 13px;
  }
  .empty .big{
    color: var(--dimmer);
    font-size: 28px;
    margin-bottom: 10px;
  }

  .log{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }
  .row{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 2px solid var(--dimmer);
    border-radius: 4px;
    padding: 12px 14px;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .row:hover{ background: var(--panel-2); border-left-color: var(--amber); }
  .row.new{
    animation: slidein .35s ease-out, glow 1.6s ease-out;
    border-left-color: var(--green);
  }
  @keyframes slidein{
    from{ transform: translateY(-6px); opacity:0; }
    to{ transform: translateY(0); opacity:1; }
  }
  @keyframes glow{
    0%{ background: rgba(63,191,127,0.10); }
    100%{ background: var(--panel); }
  }
  .row-top{
    display:flex;
    justify-content: space-between;
    gap: 14px;
    font-size: 13px;
  }
  .from{ color: var(--text); font-weight: 500; }
  .arrow{ color: var(--dimmer); margin: 0 6px; }
  .to{ color: var(--dim); }
  .time{ color: var(--dimmer); font-size: 11px; white-space:nowrap; }
  .subject{
    margin-top: 6px;
    font-size: 13px;
    color: var(--amber);
  }
  .subject::before{ content: "» "; color: var(--dimmer); }
  .preview{
    margin-top: 8px;
    font-size: 12px;
    color: var(--dim);
    line-height: 1.6;
    white-space: pre-wrap;
    display:none;
    border-top: 1px dashed var(--line);
    padding-top: 8px;
  }
  .row.open .preview{ display:block; }
  .row.open{ border-left-color: var(--amber); }

  .hermes{
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 3px;
    background: rgba(111,177,230,0.06);
    border-left: 2px solid var(--blue);
    font-size: 12px;
    color: #a9c8e0;
    line-height: 1.6;
  }
  .hermes b{ color: var(--blue); }
  .hermes.pending{ color: var(--dimmer); font-style: italic; }

  footer{
    margin-top: 30px;
    color: var(--dimmer);
    font-size: 11px;
    text-align:center;
    letter-spacing: 0.04em;
  }

  ::selection{ background: rgba(240,168,60,0.25); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">
          <span class="glyph">&gt;_</span>
          <h1>mail-relay</h1>
        </div>
        <div class="sub" id="sub">cloudflare email → webhook → agents</div>
      </div>
      <div class="status">
        <div class="pulse-row">
          <span class="dot" id="dot"></span>
          <span class="live-label" id="liveLabel">connecting</span>
        </div>
        <div class="metric">
          <b id="count">0</b>
          received
        </div>
        <div class="metric">
          <b id="lastUpdate">—</b>
          last sync
        </div>
      </div>
    </header>

    <div id="empty" class="empty">
      <div class="big">∅</div>
      no email received yet — send something to <span id="domainHint">your domain</span>
    </div>

    <div class="log" id="log"></div>

    <footer>auto-refresh over websocket · every <span id="intervalLabel">10</span>s</footer>
  </div>

<script>
  const logEl = document.getElementById('log');
  const emptyEl = document.getElementById('empty');
  const dotEl = document.getElementById('dot');
  const liveLabelEl = document.getElementById('liveLabel');
  const countEl = document.getElementById('count');
  const lastUpdateEl = document.getElementById('lastUpdate');

  let known = new Set();

  function fmtTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour12: false });
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function renderAll(emails){
    countEl.textContent = emails.length;
    emptyEl.style.display = emails.length ? 'none' : 'block';
    logEl.innerHTML = '';
    emails.forEach((e) => logEl.appendChild(makeRow(e, false)));
    known = new Set(emails.map(e => e.id));
  }

  function prependOne(email){
    known.add(email.id);
    countEl.textContent = known.size;
    emptyEl.style.display = 'none';
    const row = makeRow(email, true);
    logEl.prepend(row);
    flashDot();
  }

  function makeRow(e, isNew){
    const row = document.createElement('div');
    row.className = 'row' + (isNew ? ' new' : '');
    row.dataset.id = e.id;
    const preview = e.text || e.html || '(empty body)';
    row.innerHTML = `
      <div class="row-top">
        <div><span class="from">${escapeHtml(e.from)}</span><span class="arrow">→</span><span class="to">${escapeHtml(e.to)}</span></div>
        <div class="time">${fmtTime(e.receivedAt)}</div>
      </div>
      <div class="subject">${escapeHtml(e.subject || '(no subject)')}</div>
      <div class="preview">${escapeHtml(preview).slice(0, 2000)}</div>
      ${hermesBlockHtml(e.agentSummary)}
    `;
    row.addEventListener('click', () => row.classList.toggle('open'));
    return row;
  }

  function hermesBlockHtml(summary){
    if (summary) return `<div class="hermes"><b>hermes ›</b> ${escapeHtml(summary)}</div>`;
    return '';
  }

  function applyHermesUpdate(id, summary){
    const row = logEl.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (!row) return;
    let block = row.querySelector('.hermes');
    if (!block){
      block = document.createElement('div');
      row.appendChild(block);
    }
    block.className = 'hermes';
    block.innerHTML = `<b>hermes ›</b> ${escapeHtml(summary)}`;
  }

  function flashDot(){
    dotEl.classList.remove('flash');
    void dotEl.offsetWidth;
    dotEl.classList.add('flash');
  }

  function setLive(on){
    dotEl.classList.toggle('live', on);
    dotEl.classList.toggle('down', !on);
    liveLabelEl.textContent = on ? 'live' : 'disconnected';
    liveLabelEl.classList.toggle('on', on);
    liveLabelEl.classList.toggle('off', !on);
  }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);

    ws.onopen = () => setLive(true);
    ws.onclose = () => { setLive(false); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();

    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      lastUpdateEl.textContent = new Date().toLocaleTimeString([], { hour12: false });
      if (msg.type === 'init'){
        renderAll(msg.emails);
      } else if (msg.type === 'refresh'){
        renderAll(msg.emails);
      } else if (msg.type === 'new_email'){
        if (!known.has(msg.email.id)) prependOne(msg.email);
      } else if (msg.type === 'email_update'){
        applyHermesUpdate(msg.id, msg.agentSummary);
      }
    };
  }

  document.getElementById('domainHint').textContent = location.host;
  connect();
</script>
</body>
</html>
