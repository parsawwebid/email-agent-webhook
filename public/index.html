<!doctype html>
<html lang="fa" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8" />
<!-- <link rel="icon" type="image/svg+xml" href="./None.png" /> -->
<link rel="icon" href="/Nones-Black.ico" sizes="any"/>
<link rel="icon" href="./Nones-Black.ico" sizes="48x48"/>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --row-hover: #f7f7f6;
    --row-selected: #fbece5;
    --border: #e6e5e1;
    --text: #1a1a18;
    --text-2: #6b6a64;
    --text-3: #a2a099;
    --accent: #d8683a;
    --accent-bg: #fbece5;
    --green: #1d9e75;
    --blue: #378add;
    --blue-bg: #e6f1fb;
    --font: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  [data-theme="dark"]{
    --bg: #161614;
    --panel: #1c1c1a;
    --row-hover: #232320;
    --row-selected: #2a2419;
    --border: #302f2c;
    --text: #efeee9;
    --text-2: #a2a099;
    --text-3: #6b6a64;
    --accent: #ef9f27;
    --accent-bg: #412402;
    --green: #5dcaa5;
    --blue: #85b7eb;
    --blue-bg: #042c53;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); height:100%; }
  body{ font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); flex: none;
  }
  h1{ font-size: 16px; font-weight: 600; margin:0; }
  .status-row{ display:flex; align-items:center; gap: 16px; }
  .pill-stat{ font-size: 13px; color: var(--text-2); }
  .pill-stat b{ color: var(--text); font-weight: 600; }
  .live{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-2); }
  .live .dot{ width:6px; height:6px; border-radius:50%; background: var(--text-3); }
  .live .dot.on{ background: var(--green); }
  .live .dot.flash{ animation: flash .8s ease-out; }
  @keyframes flash{ 0%{ background: var(--accent);} 100%{ background: var(--green);} }
  .theme-btn{
    border: 1px solid var(--border); background: var(--panel); color: var(--text-2);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .theme-btn:hover{ background: var(--row-hover); }
  .theme-btn svg{ width:15px; height:15px; }

  .split{ flex: 1; display:flex; min-height:0; }

  .list-pane{ width: 100%; flex: 1; overflow-y: auto; display:flex; flex-direction:column; min-width:0; }
  .list-pane.hidden{ display:none; }
  .search-box{ flex:none; padding: 12px 20px; border-bottom: 1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .search-box input{
    width:100%; max-width: 480px; box-sizing:border-box; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 24px; padding: 9px 14px; font-size: 13px; font-family: inherit;
  }
  .search-box input:focus{ outline: none; border-color: var(--accent); }
  .filter-btn{ flex:none; border: 1px solid var(--border); background: var(--panel); color: var(--text-2); width:34px; height:34px; border-radius: 50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .filter-btn:hover{ background: var(--row-hover); }
  .filter-btn.active{ background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .filter-btn svg{ width:15px; height:15px; }
  .filter-panel{ flex:none; display:none; flex-wrap:wrap; gap: 8px 10px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .filter-panel.open{ display:flex; }
  .filter-panel input[type="text"], .filter-panel input[type="date"], .filter-panel select{
    border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 8px;
    padding: 6px 9px; font-size: 12px; font-family: inherit;
  }
  .filter-panel label{ display:flex; align-items:center; gap:5px; font-size:12px; color: var(--text-2); }
  .filter-panel .fp-field{ display:flex; flex-direction:column; gap:3px; }
  .filter-panel .fp-field span{ font-size:11px; color: var(--text-3); }
  .filter-actions{ flex:none; display:flex; gap:8px; align-items:flex-end; }
  .filter-actions button{
    border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .filter-apply{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .filter-clear{ background: var(--panel); color: var(--text-2); }
  .list-rows{ flex:1; overflow-y:auto; }
  .row{ display:flex; align-items:center; gap:12px; padding: 0 20px; height: 42px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover{ background: var(--row-hover); box-shadow: inset 1px 0 0 var(--border), inset -1px 0 0 var(--border); }
  .row:hover .r-star{ opacity:1; }
  .row.selected{ background: var(--row-selected); }
  .row.unread .r-from, .row.unread .r-subject-text{ font-weight: 600; color: var(--text); }
  .row.unread .r-dot{ background: var(--blue); }
  .row.new{ animation: slidein .3s ease-out; }
  @keyframes slidein{ from{ opacity:0; transform: translateY(-4px);} to{ opacity:1; transform:none; } }
  .r-check{ flex:none; width:16px; height:16px; accent-color: var(--accent); cursor:pointer; }
  .r-star{ flex:none; width:16px; height:16px; opacity:0; cursor:pointer; color: var(--text-3); background:none; border:0; padding:0; display:flex; align-items:center; justify-content:center; }
  .r-star.on{ opacity:1; color: var(--accent); }
  .r-star svg{ width:16px; height:16px; }
  .r-dot{ flex:none; width:6px; height:6px; border-radius:50%; background: transparent; }
  .r-from{ flex:none; width: 160px; font-weight: 400; font-size: 13px; color: var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r-subject{ flex:1; min-width:0; font-size: 13px; color: var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  .r-subject-text{ color: var(--text); }
  .r-snippet{ color: var(--text-3); overflow:hidden; text-overflow:ellipsis; }
  .r-clip{ flex:none; width:14px; height:14px; color: var(--text-3); }
  .r-time-slot{ flex:none; width: 56px; height: 100%; position: relative; }
  .r-time{ font-size: 12px; color: var(--text-3); white-space:nowrap; position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; }
  .row:hover .r-time{ opacity:0; pointer-events:none; }
  .r-archive{ opacity:0; border:0; background:none; color: var(--text-2); cursor:pointer; padding:0; position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end; }
  .row:hover .r-archive{ opacity:1; }
  .r-archive:hover{ color: var(--accent); }
  .r-archive svg{ width:16px; height:16px; }

  .detail-pane{ flex: 1; min-width: 0; overflow: hidden; padding: 0 32px 0; display: flex; flex-direction: column; }
  .detail-pane.hidden{ display:none; }
  .back-btn{ flex:none; display:flex; align-items:center; gap:8px; border:0; background:none; color: var(--text-2); cursor:pointer; font-size:13px; font-family:inherit; padding: 16px 0 0; margin-bottom: 8px; }
  .back-btn:hover{ color: var(--text); }
  .back-btn svg{ width:16px; height:16px; }
  .empty-detail, .empty-list{ color: var(--text-3); font-size: 13px; text-align:center; padding: 60px 20px; }
  .d-head{ flex: none; }
  .d-subject{ font-size: 19px; font-weight: 600; margin: 0 0 10px; word-break: break-word; }
  .d-meta{ font-size: 13px; color: var(--text-2); margin-bottom: 4px; word-break: break-word; }
  .d-meta .label{ color: var(--text-3); }
  .d-meta .addr{ color: var(--text-3); }
  .d-meta b{ color: var(--text); font-weight: 500; }
  .d-time{ font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
  .d-body{ flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; word-break: break-word; border-top: 1px solid var(--border); padding: 16px 0 24px; }
  .d-body-wrap{ flex: 1; min-height: 0; display: flex; border-top: 1px solid var(--border); margin: 0 -32px; padding: 0 32px 24px; }
  .d-body-frame{ flex: 1; width: 100%; height: 100%; border: 0; background: #fff; }
  .tag{ flex: none; display:inline-flex; align-items:center; gap: 6px; font-size: 12px; margin-bottom: 16px; padding: 6px 12px; border-radius: 8px; background: var(--blue-bg); color: var(--blue); align-self: flex-start; }
  .d-attachments{ flex:none; display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 16px; }
  .d-attachment{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; }
  .d-attachment svg{ width:14px; height:14px; flex:none; color: var(--text-3); }
</style>
</head>
<body>
  <header>
    <h1>Inbox</h1>
    <div class="status-row">
      <span class="pill-stat"><b id="count">0</b> emails</span>
      <span class="live"><span class="dot" id="dot"></span><span id="liveLabel">connecting</span></span>
      <button class="theme-btn" id="themeBtn" aria-label="toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="split">
    <div class="list-pane" id="listPane">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search mail" />
        <button class="filter-btn" id="filterBtn" aria-label="toggle filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        </button>
      </div>
      <div class="filter-panel" id="filterPanel">
        <div class="fp-field"><span>from</span><input type="text" id="fSender" placeholder="name or address" /></div>
        <div class="fp-field"><span>domain</span><input type="text" id="fDomain" placeholder="example.com" /></div>
        <div class="fp-field"><span>search in</span>
          <select id="fField">
            <option value="all">everywhere</option>
            <option value="subject">subject</option>
            <option value="body">body</option>
            <option value="from">from</option>
            <option value="to">to</option>
          </select>
        </div>
        <div class="fp-field"><span>keyword</span><input type="text" id="fKeyword" placeholder="keyword" /></div>
        <div class="fp-field"><span>since</span><input type="date" id="fSince" /></div>
        <div class="fp-field"><span>until</span><input type="date" id="fUntil" /></div>
        <label><input type="checkbox" id="fAttachment" /> has attachment</label>
        <div class="filter-actions">
          <button type="button" class="filter-apply" id="fApply">apply</button>
          <button type="button" class="filter-clear" id="fClear">clear</button>
        </div>
      </div>
      <div class="list-rows" id="listRows">
        <div class="empty-list" id="emptyList">no email yet</div>
      </div>
    </div>
    <div class="detail-pane hidden" id="detailPane">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        back to inbox
      </button>
      <div id="detailContent" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <div class="empty-detail">select an email to read it</div>
      </div>
    </div>
  </div>

<script>
  const listPane = document.getElementById('listPane');
  const listRows = document.getElementById('listRows');
  const emptyList = document.getElementById('emptyList');
  const searchInput = document.getElementById('searchInput');
  const detailPane = document.getElementById('detailPane');
  const dotEl = document.getElementById('dot');
  const liveLabelEl = document.getElementById('liveLabel');
  const countEl = document.getElementById('count');
  const themeBtn = document.getElementById('themeBtn');

  let emailsById = new Map();
  let order = [];
  let selectedId = null;
  let searchTerm = '';

  function snippetOf(e){
    const raw = (e.text || (e.html || '').replace(/<[^>]*>/g, ' ')).replace(/\s+/g, ' ').trim();
    return raw;
  }

  function matchesSearch(e){
    if (!searchTerm) return true;
    const hay = `${e.from||''} ${e.to||''} ${e.subject||''} ${e.text||e.html||''}`.toLowerCase();
    return hay.includes(searchTerm);
  }

  function fmtTime(iso){ return new Date(iso).toLocaleTimeString([], { hour12:false, hour:'2-digit', minute:'2-digit' }); }
  function fmtFull(iso){ return new Date(iso).toLocaleString([], { hour12:false }); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Splits "Name <address@x.com>" into { name, address }. Falls back to a bare
  // address (no display name) when the header didn't include one.
  function parseAddr(raw){
    const s = (raw || '').trim();
    const m = s.match(/^(.*)<([^<>]+)>\s*$/);
    if (m) {
      const name = m[1].trim().replace(/^["']|["']$/g, '');
      return { name, address: m[2].trim() };
    }
    return { name: '', address: s };
  }
  function fmtAddr(raw){
    const { name, address } = parseAddr(raw);
    if (!name) return escapeHtml(address);
    return `<b>${escapeHtml(name)}</b> <span class="addr">${escapeHtml(address)}</span>`;
  }

  function renderList(){
    const visible = order.filter(id => matchesSearch(emailsById.get(id)));
    countEl.textContent = searchTerm ? `${visible.length}/${order.length}` : order.length;
    emptyList.style.display = visible.length ? 'none' : 'block';
    emptyList.textContent = order.length ? 'no match' : 'no email yet';
    listRows.querySelectorAll('.row').forEach(r => r.remove());
    visible.forEach(id => {
      const e = emailsById.get(id);
      const isUnread = !e.isRead;
      const isStarred = !!e.starred;
      const { name, address } = parseAddr(e.from);
      const fromLabel = name || address || '(unknown)';
      const row = document.createElement('div');
      row.className = 'row' + (id === selectedId ? ' selected' : '') + (isUnread ? ' unread' : '');
      row.dataset.id = id;
      const hasAttachment = !!(e.attachments && e.attachments.length);
      row.innerHTML = `
        <input type="checkbox" class="r-check" aria-label="select email" />
        <button type="button" class="r-star${isStarred ? ' on' : ''}" aria-label="star email">
          <svg viewBox="0 0 24 24" fill="${isStarred ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </button>
        <span class="r-dot"></span>
        <span class="r-from">${escapeHtml(fromLabel)}</span>
        <span class="r-subject">
          ${hasAttachment ? `<svg class="r-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 01-7.78-7.78l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg>` : ''}
          <span class="r-subject-text">${escapeHtml(e.subject || '(no subject)')}</span> <span class="r-snippet">- ${escapeHtml(snippetOf(e))}</span>
        </span>
        <span class="r-time-slot">
          <span class="r-time">${fmtTime(e.receivedAt)}</span>
          <button type="button" class="r-archive" aria-label="archive email">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 001 1h12a1 1 0 001-1V8M10 13h4"/></svg>
          </button>
        </span>
      `;
      row.addEventListener('click', (ev) => {
        if (ev.target.closest('.r-check') || ev.target.closest('.r-star') || ev.target.closest('.r-archive')) return;
        selectEmail(id);
      });
      row.querySelector('.r-star').addEventListener('click', (ev) => {
        ev.stopPropagation();
        toggleStar(id, !e.starred);
      });
      row.querySelector('.r-archive').addEventListener('click', (ev) => {
        ev.stopPropagation();
        archiveEmail(id);
      });
      listRows.appendChild(row);
    });
  }

  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderList();
  });

  function selectEmail(id){
    selectedId = id;
    listPane.classList.add('hidden');
    detailPane.classList.remove('hidden');
    renderDetail();
    const e = emailsById.get(id);
    if (e && !e.isRead) {
      e.isRead = true;
      renderList();
      markRead(id, true);
    } else {
      renderList();
    }
  }

  function markRead(id, isRead){
    fetch(`/emails/${id}/read`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ isRead }),
    }).catch(err => console.error('Failed to mark read:', err));
  }

  function toggleStar(id, starred){
    const e = emailsById.get(id);
    if (e) e.starred = starred;
    renderList();
    fetch(`/emails/${id}/star`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ starred }),
    }).catch(err => console.error('Failed to star:', err));
  }

  function archiveEmail(id){
    order = order.filter(x => x !== id);
    emailsById.delete(id);
    if (selectedId === id) backToInbox();
    renderList();
    fetch(`/emails/${id}/archive`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ archived: true }),
    }).catch(err => console.error('Failed to archive:', err));
  }
  function backToInbox(){
    selectedId = null;
    detailPane.classList.add('hidden');
    listPane.classList.remove('hidden');
  }

  document.getElementById('backBtn').addEventListener('click', backToInbox);

  function renderDetail(){
    const detailContent = document.getElementById('detailContent');
    const e = emailsById.get(selectedId);
    if (!e){ detailContent.innerHTML = '<div class="empty-detail">select an email to read it</div>'; return; }

    const hasHtml = !!(e.html && e.html.trim());
    const bodyHtml = hasHtml
      ? `<div class="d-body-wrap"><iframe class="d-body-frame" id="bodyFrame" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe></div>`
      : `<div class="d-body">${escapeHtml(e.text || '(empty body)')}</div>`;

    detailContent.innerHTML = `
      <div class="d-head">
        <div class="d-subject">${escapeHtml(e.subject || '(no subject)')}</div>
        <div class="d-meta"><span class="label">from:</span> ${fmtAddr(e.from)}</div>
        <div class="d-meta"><span class="label">to:</span> ${fmtAddr(e.to)}</div>
        <div class="d-meta"><span class="label">date:</span> ${fmtFull(e.receivedAt)}</div>
        <div style="margin-bottom: 16px;"></div>
        ${e.agentSummary ? `<div class="tag">${escapeHtml(e.agentSummary)}</div>` : ''}
        ${(e.attachments && e.attachments.length) ? `<div class="d-attachments">${e.attachments.map(a => `<span class="d-attachment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 01-7.78-7.78l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.2 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg>${escapeHtml(a.filename || a.name || 'attachment')}</span>`).join('')}</div>` : ''}
      </div>
      ${bodyHtml}
    `;

    // Load HTML into the iframe via srcdoc so it renders as real markup, not as
    // escaped text. sandbox (no allow-scripts, no allow-same-origin) keeps any
    // scripts/tracking pixels in the email from touching the dashboard page.
    // The frame sits in a flex:1 wrapper, so it fills whatever space is left
    // under the header and stays responsive on resize with no JS involved -
    // scrolling happens inside the iframe itself, the outer page never grows.
    if (hasHtml) {
      document.getElementById('bodyFrame').srcdoc = e.html;
    }
  }

  function setAll(emails){
    emailsById = new Map(emails.map(e => [e.id, e]));
    order = emails.map(e => e.id);
    if (selectedId && !emailsById.has(selectedId)) selectedId = null;
    renderList();
    if (selectedId) renderDetail();
  }

  function addNew(email){
    emailsById.set(email.id, email);
    order.unshift(email.id);
    renderList();
    flashDot();
    const firstRow = listRows.querySelector('.row');
    if (firstRow) firstRow.classList.add('new');
    if (!selectedId) selectEmail(email.id);
  }

  function updateOne(id, agentSummary){
    const e = emailsById.get(id);
    if (!e) return;
    e.agentSummary = agentSummary;
    if (id === selectedId) renderDetail();
  }

  function flashDot(){ dotEl.classList.remove('flash'); void dotEl.offsetWidth; dotEl.classList.add('flash'); }
  function setLive(on){ dotEl.classList.toggle('on', on); liveLabelEl.textContent = on ? 'live' : 'reconnecting'; }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => setLive(true);
    ws.onclose = () => { setLive(false); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'init' || msg.type === 'refresh') { if (!isFiltering) setAll(msg.emails); }
      else if (msg.type === 'new_email' && !emailsById.has(msg.email.id)) { if (!isFiltering) addNew(msg.email); }
      else if (msg.type === 'email_update') updateOne(msg.id, msg.agentSummary);
      else if (msg.type === 'email_read') { const e = emailsById.get(msg.id); if (e) { e.isRead = msg.isRead; renderList(); } }
      else if (msg.type === 'email_star') { const e = emailsById.get(msg.id); if (e) { e.starred = msg.starred; renderList(); } }
      else if (msg.type === 'email_archive' && msg.archived) { order = order.filter(x => x !== msg.id); emailsById.delete(msg.id); renderList(); }
    };
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  let isFiltering = false;
  const filterBtn = document.getElementById('filterBtn');
  const filterPanel = document.getElementById('filterPanel');
  filterBtn.addEventListener('click', () => filterPanel.classList.toggle('open'));

  function applyFilters(){
    const params = new URLSearchParams();
    const sender = document.getElementById('fSender').value.trim();
    const domain = document.getElementById('fDomain').value.trim();
    const field = document.getElementById('fField').value;
    const keyword = document.getElementById('fKeyword').value.trim();
    const since = document.getElementById('fSince').value;
    const until = document.getElementById('fUntil').value;
    const hasAttachment = document.getElementById('fAttachment').checked;
    if (sender) params.set('sender', sender);
    if (domain) params.set('domain', domain);
    if (keyword) { params.set('keyword', keyword); params.set('field', field); }
    if (since) params.set('since', new Date(since).toISOString());
    if (until) params.set('until', new Date(until + 'T23:59:59').toISOString());
    if (hasAttachment) params.set('has_attachment', 'true');
    params.set('limit', '100');

    isFiltering = [...params.keys()].some(k => k !== 'limit');
    filterBtn.classList.toggle('active', isFiltering);

    fetch(`/emails/search?${params.toString()}`)
      .then(r => r.json())
      .then(emails => { setAll(emails); })
      .catch(err => console.error('Filter search failed:', err));
  }

  document.getElementById('fApply').addEventListener('click', applyFilters);
  document.getElementById('fClear').addEventListener('click', () => {
    ['fSender','fDomain','fKeyword','fSince','fUntil'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('fField').value = 'all';
    document.getElementById('fAttachment').checked = false;
    isFiltering = false;
    filterBtn.classList.remove('active');
    fetch('/emails').then(r => r.json()).then(emails => setAll(emails)).catch(err => console.error(err));
  });

  connect();
</script>
</body>
</html>
