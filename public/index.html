<!doctype html>
<html lang="fa" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="./None.png" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --row-hover: #f7f7f6;
    --row-selected: #fbece5;
    --border: #e6e5e1;
    --text: #1a1a18;
    --text-2: #6b6a64;
    --text-3: #a2a099;
    --accent: #d8683a;
    --accent-bg: #fbece5;
    --green: #1d9e75;
    --blue: #378add;
    --blue-bg: #e6f1fb;
    --font: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  [data-theme="dark"]{
    --bg: #161614;
    --panel: #1c1c1a;
    --row-hover: #232320;
    --row-selected: #2a2419;
    --border: #302f2c;
    --text: #efeee9;
    --text-2: #a2a099;
    --text-3: #6b6a64;
    --accent: #ef9f27;
    --accent-bg: #412402;
    --green: #5dcaa5;
    --blue: #85b7eb;
    --blue-bg: #042c53;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background: var(--bg); height:100%; }
  body{ font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border); flex: none;
  }
  h1{ font-size: 16px; font-weight: 600; margin:0; }
  .status-row{ display:flex; align-items:center; gap: 16px; }
  .pill-stat{ font-size: 13px; color: var(--text-2); }
  .pill-stat b{ color: var(--text); font-weight: 600; }
  .live{ display:flex; align-items:center; gap:6px; font-size:12px; color: var(--text-2); }
  .live .dot{ width:6px; height:6px; border-radius:50%; background: var(--text-3); }
  .live .dot.on{ background: var(--green); }
  .live .dot.flash{ animation: flash .8s ease-out; }
  @keyframes flash{ 0%{ background: var(--accent);} 100%{ background: var(--green);} }
  .theme-btn{
    border: 1px solid var(--border); background: var(--panel); color: var(--text-2);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .theme-btn:hover{ background: var(--row-hover); }
  .theme-btn svg{ width:15px; height:15px; }

  .split{ flex: 1; display:flex; min-height:0; }

  .list-pane{ width: 300px; flex: none; border-right: 1px solid var(--border); overflow-y: auto; display:flex; flex-direction:column; }
  .search-box{ flex:none; padding: 10px; border-bottom: 1px solid var(--border); }
  .search-box input{
    width:100%; box-sizing:border-box; border: 1px solid var(--border); background: var(--bg);
    color: var(--text); border-radius: 8px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  .search-box input:focus{ outline: none; border-color: var(--accent); }
  .list-rows{ flex:1; overflow-y:auto; }
  .row{ padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .row:hover{ background: var(--row-hover); }
  .row.selected{ background: var(--row-selected); }
  .row.new{ animation: slidein .3s ease-out; }
  @keyframes slidein{ from{ opacity:0; transform: translateY(-4px);} to{ opacity:1; transform:none; } }
  .r-line1{ display:flex; justify-content:space-between; gap:8px; }
  .r-from{ font-weight: 600; font-size: 13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .r-time{ font-size: 11px; color: var(--text-3); white-space:nowrap; flex:none; }
  .r-subject{ font-size: 12px; color: var(--text-2); margin-top: 3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .detail-pane{ flex: 1; overflow-y: auto; padding: 24px 32px; }
  .empty-detail, .empty-list{ color: var(--text-3); font-size: 13px; text-align:center; padding: 60px 20px; }
  .d-subject{ font-size: 19px; font-weight: 600; margin: 0 0 10px; }
  .d-meta{ font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .d-meta b{ color: var(--text); font-weight: 500; }
  .d-time{ font-size: 12px; color: var(--text-3); margin-bottom: 20px; }
  .d-body{ font-size: 14px; line-height: 1.8; color: var(--text); white-space: pre-wrap; border-top: 1px solid var(--border); padding-top: 16px; }
  .tag{ display:inline-flex; align-items:center; gap: 6px; font-size: 12px; margin-bottom: 16px; padding: 6px 12px; border-radius: 8px; background: var(--blue-bg); color: var(--blue); }
</style>
</head>
<body>
  <header>
    <h1>Inbox</h1>
    <div class="status-row">
      <span class="pill-stat"><b id="count">0</b> emails</span>
      <span class="live"><span class="dot" id="dot"></span><span id="liveLabel">connecting</span></span>
      <button class="theme-btn" id="themeBtn" aria-label="toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="split">
    <div class="list-pane" id="listPane">
      <div class="search-box"><input type="text" id="searchInput" placeholder="Search mail" /></div>
      <div class="list-rows" id="listRows">
        <div class="empty-list" id="emptyList">no email yet</div>
      </div>
    </div>
    <div class="detail-pane" id="detailPane">
      <div class="empty-detail">select an email to read it</div>
    </div>
  </div>

<script>
  const listPane = document.getElementById('listPane');
  const listRows = document.getElementById('listRows');
  const emptyList = document.getElementById('emptyList');
  const searchInput = document.getElementById('searchInput');
  const detailPane = document.getElementById('detailPane');
  const dotEl = document.getElementById('dot');
  const liveLabelEl = document.getElementById('liveLabel');
  const countEl = document.getElementById('count');
  const themeBtn = document.getElementById('themeBtn');

  let emailsById = new Map();
  let order = [];
  let selectedId = null;
  let searchTerm = '';

  function matchesSearch(e){
    if (!searchTerm) return true;
    const hay = `${e.from||''} ${e.to||''} ${e.subject||''} ${e.text||e.html||''}`.toLowerCase();
    return hay.includes(searchTerm);
  }

  function fmtTime(iso){ return new Date(iso).toLocaleTimeString([], { hour12:false, hour:'2-digit', minute:'2-digit' }); }
  function fmtFull(iso){ return new Date(iso).toLocaleString([], { hour12:false }); }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderList(){
    const visible = order.filter(id => matchesSearch(emailsById.get(id)));
    countEl.textContent = searchTerm ? `${visible.length}/${order.length}` : order.length;
    emptyList.style.display = visible.length ? 'none' : 'block';
    emptyList.textContent = order.length ? 'no match' : 'no email yet';
    listRows.querySelectorAll('.row').forEach(r => r.remove());
    visible.forEach(id => {
      const e = emailsById.get(id);
      const row = document.createElement('div');
      row.className = 'row' + (id === selectedId ? ' selected' : '');
      row.dataset.id = id;
      row.innerHTML = `
        <div class="r-line1"><span class="r-from">${escapeHtml(e.from)}</span><span class="r-time">${fmtTime(e.receivedAt)}</span></div>
        <div class="r-subject">${escapeHtml(e.subject || '(no subject)')}</div>
      `;
      row.addEventListener('click', () => selectEmail(id));
      listRows.appendChild(row);
    });
  }

  searchInput.addEventListener('input', () => {
    searchTerm = searchInput.value.trim().toLowerCase();
    renderList();
  });

  function selectEmail(id){
    selectedId = id;
    listRows.querySelectorAll('.row').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
    renderDetail();
  }

  function renderDetail(){
    const e = emailsById.get(selectedId);
    if (!e){ detailPane.innerHTML = '<div class="empty-detail">select an email to read it</div>'; return; }
    const body = e.text || e.html || '(empty body)';
    detailPane.innerHTML = `
      <div class="d-subject">${escapeHtml(e.subject || '(no subject)')}</div>
      <div class="d-meta"><b>${escapeHtml(e.from)}</b> → ${escapeHtml(e.to)}</div>
      <div class="d-time">${fmtFull(e.receivedAt)}</div>
      ${e.agentSummary ? `<div class="tag">${escapeHtml(e.agentSummary)}</div>` : ''}
      <div class="d-body">${escapeHtml(body)}</div>
    `;
  }

  function setAll(emails){
    emailsById = new Map(emails.map(e => [e.id, e]));
    order = emails.map(e => e.id);
    if (selectedId && !emailsById.has(selectedId)) selectedId = null;
    renderList();
    if (selectedId) renderDetail();
  }

  function addNew(email){
    emailsById.set(email.id, email);
    order.unshift(email.id);
    renderList();
    flashDot();
    const firstRow = listRows.querySelector('.row');
    if (firstRow) firstRow.classList.add('new');
    if (!selectedId) selectEmail(email.id);
  }

  function updateOne(id, agentSummary){
    const e = emailsById.get(id);
    if (!e) return;
    e.agentSummary = agentSummary;
    if (id === selectedId) renderDetail();
  }

  function flashDot(){ dotEl.classList.remove('flash'); void dotEl.offsetWidth; dotEl.classList.add('flash'); }
  function setLive(on){ dotEl.classList.toggle('on', on); liveLabelEl.textContent = on ? 'live' : 'reconnecting'; }

  function connect(){
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => setLive(true);
    ws.onclose = () => { setLive(false); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'init' || msg.type === 'refresh') setAll(msg.emails);
      else if (msg.type === 'new_email' && !emailsById.has(msg.email.id)) addNew(msg.email);
      else if (msg.type === 'email_update') updateOne(msg.id, msg.agentSummary);
    };
  }

  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  connect();
</script>
</body>
</html>
